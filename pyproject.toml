[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scriptforge"
version = "0.1.0"
description = "Generator i katalog skryptów z API modeli: Google Gemini, NVIDIA NIM, Z.ai (GLM)"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
scriptforge = "scriptforge.cli:main"

[tool.setuptools.packages.find]
include = ["scriptforge*"]

[tool.setuptools.package-data]
scriptforge = ["templates/*.html", "static/*.css"]
