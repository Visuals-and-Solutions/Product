<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nowy skrypt — ScriptForge</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>⚒️ ScriptForge</h1>
    <nav>
      <a href="{{ url_for('index') }}">← Skrypty</a>
    </nav>
  </header>

  <main>
    <h2>Wygeneruj nowy skrypt</h2>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('generate') }}" class="gen-form">
      <label>Zadanie (prompt)
        <textarea name="task" rows="4" required placeholder="np. skrypt backupu katalogu do tar.gz z rotacją 7 dni">{{ task }}</textarea>
      </label>

      <div class="row">
        <label>Provider
          <select name="provider">
            {% for p in provider_rows if p.name != 'mock' %}
            <option value="{{ p.name }}" {{ 'selected' if p.name == provider }} {{ 'disabled' if not p.configured }}>
              {{ p.label }}{{ ' (brak klucza)' if not p.configured }}
            </option>
            {% endfor %}
          </select>
        </label>

        <label>Język
          <select name="language">
            {% for lang in languages %}
            <option value="{{ lang }}" {{ 'selected' if lang == language }}>{{ lang }}</option>
            {% endfor %}
          </select>
        </label>
      </div>

      <div class="row">
        <label>Model (opcjonalnie)
          <input type="text" name="model" id="model-input" value="{{ model }}" placeholder="domyślny providera" list="model-list">
          <datalist id="model-list"></datalist>
          <small id="model-status" class="meta"></small>
        </label>

        <label>Tagi (po przecinku)
          <input type="text" name="tags" value="{{ tags }}" placeholder="backup,devops">
        </label>
      </div>

      <button type="submit">Generuj skrypt</button>
    </form>
  </main>

  <script>
    const modelInput = document.getElementById('model-input');
    const modelList = document.getElementById('model-list');
    const modelStatus = document.getElementById('model-status');
    const providerSelect = document.querySelector('select[name="provider"]');

    function loadModels(refresh) {
      const provider = providerSelect.value;
      modelStatus.textContent = 'Ładowanie modeli…';
      modelList.innerHTML = '';
      const url = '/api/models?provider=' + encodeURIComponent(provider) + (refresh ? '&refresh=1' : '');
      fetch(url)
        .then(r => r.json())
        .then(info => {
          for (const m of info.models || []) {
            const opt = document.createElement('option');
            opt.value = m;
            modelList.appendChild(opt);
          }
          const src = {api: 'z API', cache: 'z cache (' + (info.fetched_at || '') + ')', none: 'brak danych'}[info.source] || info.source;
          modelStatus.textContent = info.error
            ? 'Błąd: ' + info.error
            : 'Dostępne modele: ' + (info.models || []).length + ' (' + src + ')';
        })
        .catch(() => { modelStatus.textContent = 'Nie udało się pobrać listy modeli.'; });
    }

    providerSelect.addEventListener('change', () => loadModels(false));
    loadModels(false);
  </script>
</body>
</html>
